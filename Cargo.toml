[workspace]
members = [
    "crates/fg-protocol-common",
    "crates/fg-proto-mysql",
    "crates/fg-proto-pg",
    "crates/fg-proto-mongo",
    "crates/fg-rewrite",
    "crates/fg-meta",
    "crates/fg-control",
    "crates/fg-proxy",
    "crates/fg-cli",
    "test/differential",
    "test/matrix",
    "test/protocol",
]
resolver = "3"

[workspace.package]
version = "0.1.0-rc.1"
edition = "2024"
rust-version = "1.94.1"
publish = false
license = "MIT"
readme = "README.md"
description = "Data environments you can fork, test, and discard over MySQL and PostgreSQL"

[workspace.dependencies]
# Typed errors shared by the libraries.
thiserror = "2.0.18"
# CLI parsing and typed interchange are shared with the differential harness.
# The SQLx/Tokio pair connects to the native SQL engines and metadata store.
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = { version = "0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
reqwest = { version = "0.12.28", default-features = false, features = ["json"] }
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "mysql", "postgres", "tls-rustls-ring-native-roots"] }
# The MongoDB driver handles control-plane operations and native observation;
# the frontend wire protocol uses the separate OP_MSG implementation.
mongodb = "3.10.0"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
# Terminate TLS independently on each hop with a single crypto provider.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
base64 = "0.22"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["hmac"] }
rand = "0.8"
sha2 = "0.10"
subtle = "2.6"
tracing = "0.1"
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "json"] }
# Report and manifest timestamps; hand-rolled calendar math is not acceptable.
jiff = "0.2"
tempfile = "3"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
