# cargo-deny configuration for the dependency license audit.
# Run via `make license-audit`. CI installs a pinned cargo-deny and runs the
# same check, so a local pass must reproduce remotely.

[graph]
all-features = true

[licenses]
version = 2
# Audit the resolved external graph here. The workspace's own license is
# declared separately in LICENSE and its package manifests.
private = { ignore = true }
# Allowlist for the resolved dependency graph (including dev dependencies).
# Extending this list requires a PR justification naming the dependency:
# - Zlib: foldhash (SQLx hashbrown dependency chain)
# - BSD-3-Clause: subtle (SQLx digest dependency chain)
# - CC0-1.0: tiny-keccak (MongoDB driver SCRAM-SHA-1 chain; public
#   domain dedication)
# - CDLA-Permissive-2.0: webpki-roots (MongoDB driver rustls chain;
#   permissive data publication)
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "Unicode-3.0",
    "Zlib",
    "BSD-3-Clause",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

# rustls uses ring as its only TLS crypto provider.
[[licenses.exceptions]]
crate = "ring"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "rustls-webpki"
allow = ["ISC"]

[[licenses.exceptions]]
crate = "untrusted"
allow = ["ISC"]

[bans]
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
