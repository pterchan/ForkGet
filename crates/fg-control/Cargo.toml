[package]
name = "fg-control"
description = "Local authenticated Forkget branch lifecycle controller"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
license.workspace = true

[dependencies]
bson = { version = "2", default-features = false }
mongodb.workspace = true
percent-encoding = "2"

axum = { workspace = true, features = ["query"] }
base64.workspace = true
fg-meta = { path = "../fg-meta" }
fg-protocol-common = { path = "../fg-protocol-common", default-features = false, features = ["routing"] }
hmac.workspace = true
jiff.workspace = true
reqwest = { workspace = true, features = ["rustls-tls-native-roots", "stream"] }
ring = "0.17.14"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
sqlx.workspace = true
sqlparser = { version = "=0.63.0", default-features = false, features = ["std", "derive-dialect"] }
thiserror.workspace = true
tokio = { workspace = true, features = ["fs"] }
tokio-util = { version = "0.7", features = ["io"] }
tempfile.workspace = true
futures-core = "0.3"
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
