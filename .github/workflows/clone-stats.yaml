name: Clone traffic statistics

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: clone-traffic-statistics
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the default branch
        uses: actions/checkout@v4

      - name: Load existing statistics
        shell: bash
        run: |
          set -euo pipefail

          set +e
          git ls-remote --exit-code --heads origin traffic-stats >/dev/null
          branch_status=$?
          set -e

          case "$branch_status" in
            0)
              git fetch --depth=1 --no-tags origin \
                refs/heads/traffic-stats:refs/remotes/origin/traffic-stats
              git show origin/traffic-stats:clone-stats.json \
                > "$RUNNER_TEMP/clone-stats.json"
              ;;
            2)
              ;;
            *)
              exit "$branch_status"
              ;;
          esac

      - name: Fetch clone traffic
        shell: bash
        env:
          CLONE_TRAFFIC_TOKEN: ${{ secrets.CLONE_TRAFFIC_TOKEN }}
        run: |
          set -euo pipefail

          if [[ -z "$CLONE_TRAFFIC_TOKEN" ]]; then
            echo "::error::The CLONE_TRAFFIC_TOKEN repository secret is not configured."
            exit 1
          fi

          curl --fail-with-body --silent --show-error --location \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $CLONE_TRAFFIC_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/traffic/clones?per=day" \
            --output "$RUNNER_TEMP/clone-traffic.json"

      - name: Update statistics
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/update_clone_stats.py \
            --api-response "$RUNNER_TEMP/clone-traffic.json" \
            --stats "$RUNNER_TEMP/clone-stats.json" \
            --badge "$RUNNER_TEMP/badge.json" \
            --repository "$GITHUB_REPOSITORY"

      - name: Publish statistics
        shell: bash
        run: |
          set -euo pipefail

          if git show-ref --verify --quiet refs/remotes/origin/traffic-stats; then
            git switch --force-create traffic-stats origin/traffic-stats
          else
            git switch --orphan traffic-stats
            git rm --recursive --force . >/dev/null 2>&1 || true
          fi

          install -m 0644 "$RUNNER_TEMP/clone-stats.json" clone-stats.json
          install -m 0644 "$RUNNER_TEMP/badge.json" badge.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clone-stats.json badge.json

          if git diff --cached --quiet; then
            echo "Clone traffic statistics are already current."
            exit 0
          fi

          git commit --message "chore: update clone traffic statistics"
          git push origin HEAD:traffic-stats
